# Optional: when Docker Desktop is available
# docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: payledger-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payledger
    ports:
      - "5432:5432"
    volumes:
      - payledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payledger_pgdata:
